name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  quality:
    name: Analyze + Test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get

      # mux 集成测试（轨道封装/提取）需要 mkvmerge：choco 装完在 PATH，
      # 测试内 PATH 查找回退即可命中
      - name: Install MKVToolNix (mux integration tests)
        run: choco install mkvtoolnix -y --no-progress

      - name: dart analyze
        run: dart analyze

      - name: flutter test
        run: flutter test

  release:
    name: Build release (tag only)
    runs-on: windows-latest
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get

      - name: flutter build windows (release)
        run: flutter build windows --release

      # 便携版 zip：Release 目录全量（含 media_kit 的 mpv.dll；FFmpeg 若
      # 在 resources/ffmpeg/ 存在则由 CMake POST_BUILD 一并带入）
      - name: Package portable zip
        shell: pwsh
        run: |
          $zip = "subtitle-studio-pro-${{ github.ref_name }}-portable.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $zip
          Get-Item $zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: subtitle-studio-pro-${{ github.ref_name }}-portable
          path: subtitle-studio-pro-*.zip

      # 创建 GitHub Release 并挂便携版资产（自动更新 v1.5-2 的数据源）
      - uses: softprops/action-gh-release@v2
        with:
          files: subtitle-studio-pro-*.zip
          generate_release_notes: true
