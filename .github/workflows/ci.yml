name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # 手动触发 release 构建：不打 tag 也能验证安装包/便携版产物
  workflow_dispatch:

jobs:
  quality:
    name: Analyze + Test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get

      # mux 集成测试（轨道封装/提取）需要 mkvmerge：choco 装完在 PATH，
      # 测试内 PATH 查找回退即可命中
      - name: Install MKVToolNix (mux integration tests)
        run: choco install mkvtoolnix -y --no-progress

      - name: dart analyze
        run: dart analyze

      - name: flutter test
        run: flutter test

  release:
    name: Build release (tag / manual)
    runs-on: windows-latest
    needs: quality
    # tag 推送正式发布；workflow_dispatch 手动验证安装包产物
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get

      # 捆绑 FFmpeg（与本地 gyan full 同级规格：静态 GPL 全量构建，
      # libass/x264/x265/NVENC 齐全；GitHub CDN 稳定 URL）。
      # 须在 flutter build 前就位：CMake POST_BUILD 拷进 Release\resources\ffmpeg
      - name: Download bundled FFmpeg
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          curl.exe -L -o ffmpeg.zip $url
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force resources/ffmpeg | Out-Null
          Copy-Item ffmpeg-tmp/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe resources/ffmpeg/
          Copy-Item ffmpeg-tmp/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe resources/ffmpeg/
          Remove-Item ffmpeg.zip
          Remove-Item -Recurse -Force ffmpeg-tmp

      - name: flutter build windows (release)
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # 版本号取 pubspec（tag 与手动触发统一命名），供后续步骤引用
      - name: Build installer + portable zip
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([\d.]+)').Matches[0].Groups[1].Value
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $buildDir = "$pwd\build\windows\x64\runner\Release"
          ISCC.exe /DAppVersion=$ver "/DAppBuildDir=$buildDir" installer\subtitle-studio-pro.iss
          Compress-Archive -Path "$buildDir\*" -DestinationPath "subtitle-studio-pro-$ver-portable.zip"
          Get-ChildItem installer\dist\*.exe, *.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: subtitle-studio-pro-${{ env.APP_VERSION }}
          path: |
            installer/dist/SubtitleStudioPro-*-setup.exe
            subtitle-studio-pro-*-portable.zip

      # 仅 tag 触发：创建 GitHub Release 并挂双资产
      # （setup.exe + portable.zip，自动更新 v1.5-2 的数据源）
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            installer/dist/SubtitleStudioPro-*-setup.exe
            subtitle-studio-pro-*-portable.zip
          generate_release_notes: true
