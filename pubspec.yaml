name: subtitle_studio_pro
description: "Subtitle Studio Pro —— Windows 字幕组专用视频处理工具：字幕格式转换 / 烧录 / 提取 / 转码压缩"
publish_to: 'none'
version: 2.2.2+9

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # ── 状态管理：Riverpod（编译期安全、异步支持好、无需手动 dispose）
  flutter_riverpod: ^3.4.2

  # ── 本地存储：Hive（纯 Dart，Windows 无原生依赖）
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── 文件与目录
  path_provider: ^2.1.4
  path: ^1.9.0

  # ── 文件选择（Windows 原生对话框）
  file_picker: ^12.0.0

  # ── 拖拽导入（文件拖入窗口直接入列）
  desktop_drop: ^0.7.1

  # ── 系统通知（任务完成 toast）
  local_notifier: ^0.1.6

  # ── 视频播放（libmpv，Windows 全格式：mp4/mkv/mov/avi/flv/webm 及 Hi10P）
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.5

  # ── 分享 / 结果导出（Windows 上 fallback 到另存为）
  # 注：13.x 与 file_picker 12.x 同步迁移（win32/web 版本约束耦合）
  share_plus: ^13.3.0
  cross_file: ^0.3.4

  # ── 字符编码（GBK 字幕解码；BIG5 见下方内置说明）
  charset: ^2.0.0

  # ── 窗口管理（标题、尺寸、最小尺寸）
  window_manager: ^0.5.2

  # ── 工具
  uuid: ^4.5.1
  tray_manager: ^0.5.3
  # 调试包导出（v1.5 崩溃与日志：logs + 脱敏设置打 zip）
  archive: ^4.0.9
  # BIG5 编解码已内置（lib/services/subtitle/big5/，vendor 自停维护的
  # flutter_big5 0.0.6，BSD）；charset 仅提供 GBK/EUC/Shift-JIS

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 测试 fake FilePickerPlatform 用的 verifyToken 放行 mixin
  plugin_platform_interface: ^2.1.7
  # 测试 fake PathProviderPlatform 用的接口（服务层 tempDir 路径注入）
  path_provider_platform_interface: ^2.1.0

flutter:
  uses-material-design: true

  # 系统托盘图标（tray_manager 从 flutter_assets 解析）
  assets:
    - assets/app_icon.ico
